[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megacube"
version = "0.1.0"
description = "Satisfactory build -> procedurally generated, multi-material 3D-printable display model"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "manifold3d>=3.0",
    "trimesh>=4.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
megacube = "megacube.cli:main"

[tool.setuptools.packages.find]
include = ["megacube*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
